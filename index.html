<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FLIP | Access</title>
<meta name="description" content="كل روابط ومتجر FLIP في مكان واحد.">
<link rel="icon" href="images/mark.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
:root{--bg:#022249;--panel:#0a2f5e;--fg:#e9e5d8;--blue:#4a86cf;--red:#e0322b;--ink:#022249}
body.b{--bg:#e9e5d8;--panel:#ddd8c8;--fg:#022249;--blue:#2f6bb8;--ink:#e9e5d8}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;transition:background .3s,color .3s;overflow-x:hidden}
.stage{max-width:470px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 20px 110px;transition:transform .35s ease-in;perspective:1000px}
.stage.turn{transform:rotateY(90deg)}
.m{background:var(--fg);-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}
.top{display:flex;justify-content:space-between;align-items:center;direction:ltr}
.mini{font:700 .8rem 'Big Shoulders Display',sans-serif;letter-spacing:.14em;opacity:.7}
.swap{width:54px;height:54px;border:0;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.swap i{width:26px;height:30px;display:block;-webkit-mask-image:url(images/mark.png);mask-image:url(images/mark.png)}
.word{display:block;width:100%;aspect-ratio:700/212;margin:46px 0 22px;-webkit-mask-image:url(images/logo.png);mask-image:url(images/logo.png);animation:land 1.1s cubic-bezier(.3,1.3,.5,1) both}
.word.go{animation:spin .8s cubic-bezier(.4,.2,.2,1)}
@keyframes land{from{transform:rotateX(180deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotateX(360deg)}}
.say{text-align:center;line-height:1.7;margin-bottom:30px}
.say b{display:block;font:900 1.7rem/1 'Big Shoulders Display',sans-serif;letter-spacing:.04em;direction:ltr;margin-bottom:8px}
.say span{opacity:.8;font-size:.98rem}
.list{display:grid;gap:12px}
.card{display:block;height:86px;perspective:900px;color:inherit;text-decoration:none;outline:0}
.card.shop{height:140px}
.in{position:relative;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1)}
.card.f .in{transform:rotateX(180deg)}
.face{position:absolute;inset:0;display:flex;align-items:center;gap:16px;padding:0 20px;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{background:var(--panel)}
.back{background:var(--fg);color:var(--ink);transform:rotateX(180deg);justify-content:space-between}
.pt{position:absolute;top:12px;inset-inline-end:14px;width:7px;height:7px;background:var(--red);border-radius:80% 0 80% 0;transform:rotate(-30deg)}
.acc{font:700 .72rem 'Big Shoulders Display',sans-serif;letter-spacing:.16em;opacity:.6;direction:ltr;display:block}
.nm{font:900 1.75rem/1.1 'Big Shoulders Display',sans-serif;letter-spacing:.03em;direction:ltr;display:block;text-align:start}
.shop .nm{font-size:2.3rem}
.ar{font-size:.9rem;opacity:.75}
.mk{flex:none;width:76px;height:88px;-webkit-mask-image:url(images/mark.png);mask-image:url(images/mark.png)}
.hd{font:700 1.45rem 'Big Shoulders Display',sans-serif;letter-spacing:.04em;direction:ltr}
.go{font-weight:600}
.shop .back{background:var(--blue);color:#fff}
.dont{text-align:center;margin-top:38px;font:700 .8rem 'Big Shoulders Display',sans-serif;letter-spacing:.2em;color:var(--red);direction:ltr}
/* زر الدعم */
.help{position:fixed;inset-inline-start:max(16px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:60px;height:60px;perspective:600px;z-index:9;display:block;text-decoration:none}
.help .in{position:absolute;inset:0;animation:land 1s .8s both}
.help.f .in{transform:rotateX(180deg)}
.help .face{justify-content:center;padding:0;border-radius:50%;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.help .front{background:var(--fg);color:var(--bg)}
.help .back{background:#25a85a;color:#fff;font:700 .78rem 'IBM Plex Sans Arabic',sans-serif}
.help svg{width:28px;height:28px}
.help .pt{top:2px;inset-inline-end:2px;width:11px;height:11px;border-radius:50%;transform:none;border:2px solid var(--bg);box-sizing:content-box}
@media (prefers-reduced-motion:reduce){.word,.word.go,.help .in{animation:none}.in,.stage{transition:none}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="top">
    <span class="mini">FLIP / ACCESS</span>
    <button class="swap" id="swap" type="button" aria-label="اقلب الصفحة"><i class="m"></i></button>
  </div>
  <h1 class="word m" id="word" role="img" aria-label="FLIP"></h1>
  <div class="say"><b>FLIP THE WAY YOU LIVE.</b><span>مو كل شيء ينفهم من أول نظرة. جرّب.</span></div>
  <nav class="list" id="list" aria-label="روابط FLIP"></nav>
  <p class="dont">DON'T FLIP TOO SOON.</p>
</main>

<a class="help" id="help" href="https://wa.me/966530404826" rel="noopener" aria-label="الدعم عبر واتساب">
  <div class="in">
    <div class="face front"><i class="pt"></i><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5a9.5 9.5 0 0 0-8.1 14.4L2.7 21.5l4.7-1.2A9.5 9.5 0 1 0 12 2.5z"/><circle cx="8" cy="12" r="1.3" fill="var(--panel)"/><circle cx="12" cy="12" r="1.3" fill="var(--panel)"/><circle cx="16" cy="12" r="1.3" fill="var(--panel)"/></svg></div>
    <div class="face back">دعم</div>
  </div>
</a>

<script>
/* ===== عدّل روابطك هنا ===== */
var LINKS = [
  {shop:true, name:"SHOP", ar:"تسوّق قطع flip", hd:"ادخل المتجر", url:"https://salla.sa/flip.ksa"},
  {name:"INSTAGRAM", ar:"انستقرام", hd:"@flip.brand7", url:"https://www.instagram.com/flip.brand7"},
  {name:"TIKTOK", ar:"تيك توك", hd:"@flip.brand", url:"https://www.tiktok.com/@flip.brand"},
  {name:"SNAPCHAT", ar:"سناب شات", hd:"FLIP", url:"https://snapchat.com/t/DP3mbTw1"},
  {name:"X", ar:"إكس", hd:"@fl1p_ksa", url:"https://x.com/fl1p_ksa"}
];
/* ======================== */

var list=document.getElementById('list');
LINKS.forEach(function(l,i){
  var a=document.createElement('a');
  a.className='card'+(l.shop?' shop':'');a.href=l.url;a.rel='noopener';
  a.innerHTML='<div class="in"><div class="face front"><i class="pt"></i>'+
    (l.shop?'<i class="m mk"></i>':'')+
    '<span><span class="acc">ACCESS / 00'+(i+1)+'</span><span class="nm">'+l.name+'</span><span class="ar">'+l.ar+'</span></span></div>'+
    '<div class="face back"><span class="hd">'+l.hd+'</span><span class="go">افتح ←</span></div></div>';
  a.addEventListener('click',function(e){
    e.preventDefault();a.classList.add('f');
    setTimeout(function(){location.href=l.url},450);
  });
  list.appendChild(a);
});

var h=document.getElementById('help');
h.addEventListener('click',function(e){
  e.preventDefault();h.classList.add('f');
  setTimeout(function(){location.href=h.href},450);
});

/* لما يرجع الزائر للصفحة، رجّع البطاقات لوضعها */
window.addEventListener('pageshow',function(){
  document.querySelectorAll('.card.f,.help.f').forEach(function(c){c.classList.remove('f')});
});

/* قلب اللوقو */
var w=document.getElementById('word');
w.addEventListener('click',function(){w.classList.remove('go');void w.offsetWidth;w.classList.add('go')});

/* قلب الصفحة بين الوجهين */
var st=document.getElementById('stage');
document.getElementById('swap').addEventListener('click',function(){
  st.classList.add('turn');
  setTimeout(function(){document.body.classList.toggle('b');st.classList.remove('turn')},350);
});
</script>
</body>
</html>
